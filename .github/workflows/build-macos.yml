name: Build macOS bundles

# Manual only. The build downloads STIG Viewer from cyber.mil at run time,
# so there is nothing to trigger on in this repo.
on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Create a draft GitHub Release with the artifacts"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # node-gyp 9.x (bundled in the app's dependency tree) imports distutils,
      # which Python removed in 3.12. The runner's default is much newer, so pin
      # 3.11 - the last version that still ships distutils - for native builds.
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.11"

      # Signing runs only when the secrets are present, so a fork or a
      # credential-less run still produces working unsigned builds.
      - name: Import signing certificate
        id: signing
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # Trailing newline matters: some PEM parsers reject a key without one.
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          chmod 600 "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/asc.p8"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on an interactive keychain prompt.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$RUNNER_TEMP/cert.p12"

          echo "Identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" || {
            echo "::error::No 'Developer ID Application' identity found in the imported certificate"
            exit 1
          }

      - name: Build macOS bundles
        env:
          # Set explicitly rather than relying on PATH order: node-gyp prefers
          # npm_config_python/PYTHON over whatever python3 it finds.
          PYTHON: ${{ steps.python.outputs.python-path }}
          npm_config_python: ${{ steps.python.outputs.python-path }}
          SIGN: ${{ steps.signing.outcome == 'success' && '1' || '0' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
        run: ./bundle.sh

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Read detected version
        id: meta
        run: echo "version=$(cat dist-artifacts/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: stigviewer3-macos-${{ steps.meta.outputs.version }}
          path: dist-artifacts/
          if-no-files-found: error

      - name: Create draft release
        if: inputs.draft_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.meta.outputs.version }}
          VERSION: ${{ steps.meta.outputs.version }}
          SIGNED: ${{ steps.signing.outcome == 'success' && '1' || '0' }}
        run: |
          set -euo pipefail

          if [ "$SIGNED" = "1" ]; then
            TRUST_NOTE="These builds are signed with a Developer ID certificate and notarized by Apple, so they open normally."
          else
            TRUST_NOTE="These builds are **unsigned**. macOS Gatekeeper will block them on first launch: right-click the app, choose **Open**, then confirm."
          fi

          NOTES=$(printf '%s\n\n%s\n\n%s\n' \
            "macOS builds of STIG Viewer $VERSION, repackaged from the official Linux release published on cyber.mil." \
            "$TRUST_NOTE" \
            "Built from \`$GITHUB_SHA\` by the \`build-macos\` workflow.")

          # Re-running for the same upstream version refreshes the draft rather
          # than failing on an existing tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - deleting it before recreating"
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" \
            --draft \
            --title "STIG Viewer $VERSION (macOS)" \
            --notes "$NOTES" \
            dist-artifacts/*.zip dist-artifacts/*.dmg
