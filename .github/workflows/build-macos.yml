name: Build macOS bundles

# Manual only. The build downloads STIG Viewer from cyber.mil at run time,
# so there is nothing to trigger on in this repo.
on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Create a draft GitHub Release with the artifacts"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # node-gyp 9.x (bundled in the app's dependency tree) imports distutils,
      # which Python removed in 3.12. The runner's default is much newer, so pin
      # 3.11 - the last version that still ships distutils - for native builds.
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.11"

      - name: Build macOS bundles
        env:
          # Set explicitly rather than relying on PATH order: node-gyp prefers
          # npm_config_python/PYTHON over whatever python3 it finds.
          PYTHON: ${{ steps.python.outputs.python-path }}
          npm_config_python: ${{ steps.python.outputs.python-path }}
        run: ./bundle.sh

      - name: Read detected version
        id: meta
        run: echo "version=$(cat dist-artifacts/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: stigviewer3-macos-3.${{ steps.meta.outputs.version }}
          path: dist-artifacts/
          if-no-files-found: error

      - name: Create draft release
        if: inputs.draft_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v3.${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          # Re-running the workflow for the same upstream version should refresh
          # the draft rather than fail on an existing tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - deleting it before recreating"
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" \
            --draft \
            --title "STIG Viewer 3.${{ steps.meta.outputs.version }} (macOS)" \
            --notes "Unsigned macOS builds of STIG Viewer 3.${{ steps.meta.outputs.version }}, repackaged from the official Linux release published on cyber.mil.

          Because these are unsigned, macOS Gatekeeper will block them on first launch. Right-click the app and choose **Open**, then confirm.

          Built from \`${GITHUB_SHA}\` by the \`build-macos\` workflow." \
            dist-artifacts/*.zip dist-artifacts/*.dmg
